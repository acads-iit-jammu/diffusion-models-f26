<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W01 · Deck 03 · The World’s Smallest Diffusion Model · ID-5-02 (TO) · IIT Jammu</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [

{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"ID-5-02 (TO) · Monsoon 2026 · IIT Jammu"),
  e("h1",null,"The World’s Smallest Diffusion Model"),
  e("h2",null,"W01 · Part 3 — two data points, one line of Bayes, a complete generative model"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Uma Satyaranjan · Soma S Dhavala"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"The pitch", body:()=> e(F,null,
  html("p",'A diffusion model turns <b>pure static into an image</b>. It does exactly one thing, about a thousand times:'),
  html("p",'<span class="big" style="display:block;text-align:center">subtract a <i>little</i> noise, correctly.</span>'),
  html("div",'<div class="note">Everything in this deck is computed <b>exactly</b> — no neural network anywhere. The demos are on the course site.</div>'))},

{title:"Our dataset: two points", body:()=> e(F,null,
  html("p",'Samples from an unknown distribution; task: <b>produce more of the same</b>. Today:'),
  html("p",'<span class="big" style="display:block;text-align:center">p<sub>data</sub> = ½ δ<sub>−1</sub> + ½ δ<sub>+1</sub></span>'),
  li('Generating = flipping a coin — <i>that is why it is the right dataset:</i> nothing can hide',
     'You already know one generative model: fit N(μ, σ²) by MLE, then sample',
     '<b>Module 1:</b> MLE = minimizing KL(p<sub>data</sub> ∥ p<sub>θ</sub>)'))},

{title:"Why images break the direct approach", body:()=> e(F,null,
  li('A 64×64 RGB image lives in a space with <span class="mono">256<sup>12288</sup></span> configurations',
     'Almost all of them are <b>static</b> — random pixels never make a face',
     'Real data is a vanishingly thin filament of the space'),
  html("div",'<div class="note">Writing down p<sub>θ</sub>(image) and fitting it directly is hopeless — the curse of dimensionality (Module 1).</div>'))},

{title:"The diffusion idea", body:()=> e(F,null,
  html("p",'<span class="big" style="display:block;text-align:center">x<sub>σ</sub> = x₀ + σz, &nbsp; z ∼ N(0, 1) independent of x₀</span>'),
  li('Destroying structure with noise: <b>easy, fully understood</b>',
     'It always ends somewhere known — a Gaussian',
     'Then learn to walk <b>backwards</b>'))},

{title:"Watch noise accumulate", body:()=> e(F,null,
  html("p",'One point at 0, kicked k times by noise of size δ: spread = δ√k. Any kick distribution → same Gaussian (CLT).'),
  html("div",'<iframe src="./one-point-noise-demo.html" style="width:100%;height:56vh;border:1px solid #cfdcec;border-radius:8px" loading="lazy" title="Progressively adding noise demo"></iframe>'))},

{title:"Forward: noise melts the two points", body:()=> e(F,null,
  html("p",'<span class="big" style="display:block;text-align:center">p<sub>σ</sub>(x) = ½ N(x; −1, σ²) + ½ N(x; +1, σ²), &nbsp; Var(x<sub>σ</sub>) = 1 + σ²</span>'),
  li('Two spikes → two bumps → one bell',
     'By σ ≈ 3, indistinguishable in practice from N(0, 1 + σ²)'),
  html("p",'<span class="big" style="display:block;text-align:center">Structure destroyed. Destination known.</span>'))},

{title:"The inverse problem", body:()=> e(F,null,
  html("p",'You observe a noisy x. What was the clean point? Best guess under squared error = the <b>posterior mean</b> E[x₀ | x<sub>σ</sub> = x].'),
  html("p",'For the two-point prior, Bayes’ rule gives it in closed form:'),
  html("p",'<span class="big" style="display:block;text-align:center">P(x₀ = +1 | x) = sigmoid(2x / σ²)</span>'),
  html("div",'<div class="note">One line of algebra — <b>Exercise 1</b>, do it tonight.</div>'))},

{title:"The punchline", body:()=> e(F,null,
  html("p",'<span class="big" style="display:block;text-align:center;font-size:clamp(1.6rem,3.4vw,2.6rem);border:3px solid var(--blue);border-radius:10px;padding:.4em .6em">E[x₀ | x<sub>σ</sub> = x] = tanh(x / σ²)</span>'),
  li('The optimal denoiser is a <b>tanh</b> — produced by nothing but probability',
     'σ → 0: hard threshold — snap to the nearer point',
     'σ → ∞: shrink to 0 — trust the prior, not the observation'))},

{title:"Denoising = knowing the score", body:()=> e(F,null,
  html("p",'Differentiate log p<sub>σ</sub> and compare — <b>Tweedie’s formula</b>:'),
  html("p",'<span class="big" style="display:block;text-align:center">E[x₀ | x] = x + σ² ∇<sub>x</sub> log p<sub>σ</sub>(x)</span>'),
  li('The <b>score</b> ∇<sub>x</sub> log p<sub>σ</sub> points toward where noised data is denser',
     'Denoising and score estimation are the <i>same problem</i> — the hinge of Modules 3–4'))},

{title:"Run the diffusion backwards", body:()=> e(F,null,
  html("p",'Anneal σ downward on a grid, nudging along the score: <span class="mono">y ← y + ((σ<sub>k</sub>² − σ<sub>k+1</sub>²)/2) · (tanh(y/σ<sub>k</sub>²) − y)/σ<sub>k</sub>²</span>'),
  html("div",'<iframe src="./two-point-diffusion-demo.html" style="width:100%;height:52vh;border:1px solid #cfdcec;border-radius:8px" loading="lazy" title="Two-point diffusion demo"></iframe>'))},

{title:"What you just saw", body:()=> e(F,null,
  li('Particles start as pure noise',
     'The cloud splits, condenses, lands on the two data points',
     '<b>Generation — with every step computed exactly, no neural network</b>'),
  html("p",'<span class="big">The whole pipeline: noise the data → learn to denoise → run it backwards.</span>'))},

{title:"So where do neural networks come in?", body:()=> e(F,null,
  html("p",'For images, E[x₀ | x] has <b>no usable formula</b>. The network’s only job:'),
  html("p",'<span class="big" style="display:block;text-align:center">approximate (x, σ) ↦ E[x₀ | x]</span>'),
  html("p",'— to be the tanh we can no longer derive. Everything else survives unchanged.'))},

{title:"The course, mapped onto today", body:()=> e(F,null,
  table(["Today","Module"],[
    ["“Produce more samples”; why direct density estimation fails","<b>M1</b> Foundations"],
    ["Mixture, conditioning, Var = 1 + σ²","<b>M2</b> Gaussians &amp; noise"],
    ["The σ grid; denoising as the training target","<b>M3</b> DDPM"],
    ["Score, Tweedie’s formula","<b>M4</b> Score matching"],
    ["Noise levels as a continuum; densities evolving","<b>M5</b> SDEs, Fokker–Planck"],
    ["The reverse update; probability-flow ODE","<b>M6</b> Reverse-time dynamics"]]))},

{cls:"accent", body:()=> e(F,null,
  e("div",{className:"quote"},"Tonight: read the companion note, play with the demos, and derive the tanh yourself.",
    e("small",null,"Next lecture — Module 1: why maximum likelihood is KL divergence in disguise.")))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"ID-5-02 (TO)")," · Deck 03 · The Toy Example"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>
