<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W02 · Deck 00 · Probability, Joints, Conditionals and Bayes · ID-5-02 (TO) · IIT Jammu</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* table emphasis for the joint-count grid */
  .grid td, .grid th{text-align:center;font-family:"Roboto Mono",monospace}
  .grid td.lbl, .grid th.lbl{text-align:left;font-family:Roboto,sans-serif}
  .grid tr:nth-child(even) td{background:transparent}
  td.hi{background:#fff3cd !important;font-weight:700;color:#7a5b00}
  td.hi2{background:#e6f4ea !important;font-weight:700;color:#1e5631}
  td.tot{background:var(--blue-pale) !important;font-weight:700;color:var(--blue-dark)}
  td.net{background:#dbe9fb !important;font-weight:700;color:var(--blue-dark)}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

/* The running example: 100 tosses of two four-faced dice.
   Counts are deliberately NOT row-times-column/100, so X and Y are dependent
   and the four conditional rows genuinely differ. */
const T    = [[12,8,4,1],[6,14,7,3],[3,7,12,5],[1,3,6,8]];
const ROWS = [25,30,27,18];
const COLS = [22,32,29,17];
const NET  = 100;

// hiRow / hiCol: index to highlight (or -1). tot: show the margin row/column.
function grid(hiRow, hiCol, showTot){
  const head = '<tr><th class="lbl"></th><th>Y = 1</th><th>Y = 2</th><th>Y = 3</th><th>Y = 4</th>'
             + (showTot? '<th class="lbl">row total</th>':'') + '</tr>';
  let body = "";
  for(let i=0;i<4;i++){
    body += '<tr><td class="lbl"><b>X = '+(i+1)+'</b></td>';
    for(let j=0;j<4;j++){
      const cls = (i===hiRow? "hi" : (j===hiCol? "hi2" : ""));
      body += '<td class="'+cls+'">'+T[i][j]+'</td>';
    }
    if(showTot) body += '<td class="'+(i===hiRow?"hi":"tot")+'">'+ROWS[i]+'</td>';
    body += '</tr>';
  }
  if(showTot){
    body += '<tr><td class="lbl"><b>col total</b></td>';
    for(let j=0;j<4;j++) body += '<td class="'+(j===hiCol?"hi2":"tot")+'">'+COLS[j]+'</td>';
    body += '<td class="net">'+NET+'</td></tr>';
  }
  return '<table class="grid"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
}

const SLIDES = [

{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"ID-5-02 (TO) · Monsoon 2026 · IIT Jammu"),
  e("h1",null,"Probability, Joints, Conditionals and Bayes"),
  e("h2",null,"W02 · Primer — everything from one 4 × 4 table of counts"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Uma Satyaranjan · Soma S Dhavala"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"Two maps, and only two", body:()=> e(F,null,
  html("p",'Everything in probability is built from a pair of functions that point at <i>different arguments</i>.'),
  table(["Map","Takes","Gives","Example"],[
    ["Probability <span class='mono'>P</span>","an <b>event</b> — a set of outcomes","a number in [0, 1]","P(die is even) = 1/2"],
    ["Random variable <span class='mono'>X</span>","an <b>outcome</b> — a single ω","a real number","X(ω) = the face shown"]]),
  html("div",'<div class="note"><b>Probabilities attach to events. Numbers attach to outcomes.</b> Almost every early confusion is these two being swapped.</div>'))},

{title:"One outcome happens; many events happen", body:()=> e(F,null,
  li("The experiment produces exactly <b>one</b> outcome — roll a 4, and ω = 4",
     "But <b>many events</b> occur at once: “even”, “at most 5”, “not a 6”, and Ω itself all contain 4",
     "Outcomes are mutually exclusive. Events are not — they overlap freely"),
  html("div",'<div class="note">A random variable is <b>not</b> a function of events. The odd-indicator Y does not send the <i>set</i> {2,4,6} to 0 — it sends the outcome 2 to 0, and 4 to 0, and 6 to 0. Three outcomes that happen to share a number.</div>'),
  html("p",'The arrow that <i>does</i> exist runs backwards, and it is how every probability gets computed:'),
  html("p",'<span class="big" style="display:block;text-align:center">random variable → numerical condition → event → probability</span>'))},

{title:"The experiment: two four-faced dice", body:()=> e(F,null,
  html("p",'A coin has two faces. Give it four, roll <b>two</b> of them, and record the pair.'),
  li("Outcome: ω = (first face, second face) — there are 4 × 4 = <b>16</b> of them",
     "<b>X</b> = the first die, <b>Y</b> = the second die — two numbers read off <i>the same</i> outcome",
     "That co-residence is the whole idea of a <b>joint</b> distribution: one roll, two readings"),
  html("div",'<div class="note">Toss the pair <b>100 times</b> and tally how often each of the 16 combinations came up. That tally is the next slide, and everything today comes out of it.</div>'))},

{title:"100 tosses, tallied", body:()=> e(F,null,
  html("div",grid(-1,-1,true)),
  li("The 16 inner cells are the <b>joint</b> counts: how many tosses gave that exact pair",
     "The margins are <b>totals</b>: each row summed across, each column summed down",
     "Bottom-right is the <b>net</b> — 100 tosses, and both margins must add up to it"))},

{title:"Marginals: divide the totals by the net", body:()=> e(F,null,
  html("div",grid(-1,-1,true)),
  html("p",'Ignore Y entirely and ask only how the first die behaved — read the <b>row totals</b>:'),
  html("p",'<span class="mono">P(X = 1, 2, 3, 4) = 25/100, 30/100, 27/100, 18/100 = 0.25, 0.30, 0.27, 0.18</span>'),
  html("p",'Ignore X and read the <b>column totals</b>: &nbsp;<span class="mono">P(Y = ·) = 0.22, 0.32, 0.29, 0.17</span>'),
  html("div",'<div class="note"><b>Marginal = total ÷ net.</b> The name is literal: the answer is written in the margin of the table.</div>'))},

{title:"Conditionals: divide a row by its own total", body:()=> e(F,null,
  html("div",grid(0,-1,true)),
  html("p",'Now suppose you are <i>told</i> the first die showed 1. Only the highlighted row is still in play — the other 75 tosses never happened. Keep that row and rescale it so it sums to one:'),
  html("p",'<span class="mono">P(Y = · | X = 1) = 12/25, 8/25, 4/25, 1/25 = 0.48, 0.32, 0.16, 0.04</span>'),
  html("div",'<div class="note">Divide by the <b>row total (25)</b>, not by the net (100). Dividing by the net would give the <i>joint</i> P(X = 1, Y = ·) — a sliver of mass that sums to 0.25, not a distribution.</div>'))},

{title:"Every row is a distribution", body:()=> e(F,null,
  html("p",'Do it for all four rows. Each is a legitimate probability distribution over Y — four numbers, non-negative, summing to 1:'),
  table(["Given","Y = 1","Y = 2","Y = 3","Y = 4","Σ"],[
    ["X = 1 &nbsp;(÷25)","0.48","0.32","0.16","0.04","1"],
    ["X = 2 &nbsp;(÷30)","0.20","0.47","0.23","0.10","1"],
    ["X = 3 &nbsp;(÷27)","0.11","0.26","0.44","0.19","1"],
    ["X = 4 &nbsp;(÷18)","0.06","0.17","0.33","0.44","1"]]),
  li("The rows are <b>different</b> — knowing X changes what you expect of Y. That <i>is</i> dependence",
     "If they were all identical, X would tell you nothing and the two dice would be <b>independent</b>"),
  html("div",'<div class="note">Independence check: if X and Y were independent, cell (1,1) would be 25 × 22 / 100 = <b>5.5</b>. It is <b>12</b>. These dice are loaded together.</div>'))},

{title:"…and every column is a distribution too", body:()=> e(F,null,
  html("div",grid(-1,1,true)),
  html("p",'Nothing privileges rows. Told that the second die showed 2, keep that <b>column</b> and divide by <b>its</b> total (32):'),
  html("p",'<span class="mono">P(X = · | Y = 2) = 8/32, 14/32, 7/32, 3/32 = 0.25, 0.44, 0.22, 0.09</span>'),
  html("div",'<div class="note">One table, two families of conditionals. Rows give P(Y | X), columns give P(X | Y). The table does not care which way you slice it — and that symmetry is Bayes’ rule.</div>'))},

{title:"Bayes’ rule is the two slicings, reconciled", body:()=> e(F,null,
  html("p",'A single cell can be reached from either direction, so it has two factorizations:'),
  html("p",'<span class="big" style="display:block;text-align:center">P(x, y) = P(y | x) · P(x) = P(x | y) · P(y)</span>'),
  html("p",'Divide, and you can convert either conditional into the other:'),
  html("p",'<span class="big" style="display:block;text-align:center">P(x | y) = P(y | x) · P(x) / P(y)</span>'),
  table(["Piece","From the table","Value"],[
    ["P(Y = 2 | X = 1)","row 1, cell 2 ÷ 25","0.32"],
    ["P(X = 1)","row total ÷ net = 25/100","0.25"],
    ["P(Y = 2)","col total ÷ net = 32/100","0.32"],
    ["<b>P(X = 1 | Y = 2)</b>","0.32 × 0.25 / 0.32","<b>0.25</b>"],
    ["check: directly","col 2, cell 1 ÷ 32 = 8/32","<b>0.25</b> ✓"]]),
  html("div",'<div class="note">No new axiom — just bookkeeping on one table. Bayes matters because in practice you can <i>build</i> P(y | x) (a cause producing an observation) but you <i>want</i> P(x | y).</div>'))},

{title:"From counts to densities", body:()=> e(F,null,
  html("p",'Now let the dice have more and more faces — 4, then 400, then a continuum. The table becomes a fine grid over the plane, and:'),
  table(["Discrete table","Continuous joint"],[
    ["cell count ÷ net","p(x, y) dx dy — a <b>joint density</b>"],
    ["a single row","a vertical <b>slice</b> of the surface at x"],
    ["that row’s total","the marginal value p(x) — the slice’s area"],
    ["row ÷ row total","p(y | x) = p(x, y) / p(x) — the slice, <b>renormalised</b>"],
    ["column totals","p(y) = ∫ p(x, y) dx"]]),
  html("div",'<div class="note">Nothing conceptual changes. <b>Sums become integrals</b>, and “divide the row by its total” becomes “divide the slice by its area”. Slice, then renormalise.</div>'))},

{title:"Marginalising = integrating out the nuisance", body:()=> e(F,null,
  html("p",'Summing a row is exactly integrating out the variable you do not care about:'),
  html("p",'<span class="big" style="display:block;text-align:center">p(x) = ∫ p(x, y) dy &nbsp;&nbsp;&nbsp; p(y) = ∫ p(x, y) dx</span>'),
  li("With many variables, integrate out <b>every</b> one you are not asking about — the <b>nuisance</b> variables",
     "<span class='mono'>p(x<sub>1</sub>) = ∫∫⋯∫ p(x<sub>1</sub>, x<sub>2</sub>, …, x<sub>n</sub>) dx<sub>2</sub> ⋯ dx<sub>n</sub></span>",
     "Latent variables are the nuisance case that matters here: <span class='mono'>p(x) = Σ<sub>z</sub> p(x, z)</span> is exactly a <b>mixture</b>"),
  html("div",'<div class="note">Marginalising <b>loses information</b> and cannot be undone: many different joints share the same margins. Two dice with these row and column totals could have been independent — they were not.</div>'))},

{title:"Factorisation: build a joint out of conditionals", body:()=> e(F,null,
  html("p",'Read P(x, y) = P(y | x) P(x) the other way — not as an identity to check, but as a <b>recipe to generate</b>: draw x from its marginal, then draw y from the row it selects.'),
  html("p",'Pick any ordering of the variables and the same move chains:'),
  html("p",'<span class="big" style="display:block;text-align:center">p(x<sub>1</sub>, …, x<sub>n</sub>) = p(x<sub>1</sub>) · p(x<sub>2</sub> | x<sub>1</sub>) · p(x<sub>3</sub> | x<sub>1</sub>, x<sub>2</sub>) ⋯ p(x<sub>n</sub> | x<sub>1</sub>, …, x<sub>n−1</sub>)</span>'),
  li("Each factor conditions on a <b>set</b> — everything already drawn, not just the previous one",
     "The ordering is <b>yours to choose</b>: any permutation gives a valid and different factorisation",
     "Every factor is still just “a row, renormalised” — of a higher-dimensional table"),
  html("div",'<div class="note">This is the chain rule of probability, and it is how every sequential generative model is defined: language models factorise left to right, diffusion models factorise along the noise level.</div>'))},

{title:"Where this lands in the course", body:()=> e(F,null,
  table(["Today’s object","Where it reappears"],[
    ["Joint p(x, z)","the mixture model — latent label and observation"],
    ["Marginalising out z","the mixture density; later, the evidence and the ELBO"],
    ["Conditional as a renormalised slice","p(x<sub>t</sub> | x<sub>0</sub>): the forward noising step"],
    ["Bayes, the two slicings","p(x<sub>0</sub> | x<sub>t</sub>): the posterior a <b>denoiser</b> estimates"],
    ["Posterior <i>mean</i> of a slice","E[x<sub>0</sub> | x<sub>t</sub>] = tanh(x/σ²) — W01’s denoiser, exactly"],
    ["Chain rule with an ordering","p(x<sub>0:T</sub>) = p(x<sub>T</sub>) ∏ p(x<sub>t−1</sub> | x<sub>t</sub>) — the reverse process"]]),
  html("div",'<div class="note">The whole of diffusion is these four moves on one very large joint: the joint of a clean signal and its noisy versions.</div>'))},

{cls:"accent", body:()=> e(F,null,
  e("div",{className:"quote"},"One table. Totals give marginals, rows give conditionals, and reading a cell two ways gives Bayes.",
    e("small",null,"Tutorials: Probability & Random Variables (Foundations) · Joint, Marginal, Conditional — and Bayes (Advanced) · demo: The Joint Slicer")))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"ID-5-02 (TO)")," · W02 · Primer · Probability, Joints & Bayes"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>
