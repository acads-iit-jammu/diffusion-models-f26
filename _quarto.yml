book:
  title: "ID-5-02 (TO)"
  subtitle: "Mathematical Foundations of Diffusion Models · Monsoon 2026"
  author: "Uma Satyaranjan · Soma S Dhavala · IIT Jammu"
  reader-mode: true
  sidebar:
    collapse-level: 1

  page-footer:
    left: |
      ID-5-02 (TO) · Mathematical Foundations of Diffusion Models · Monsoon 2026 (2026-01) · IIT Jammu
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  site-url: https://acads-iit-jammu.github.io/diffusion-models-f26
  repo-url: https://github.com/acads-iit-jammu/diffusion-models-f26
  repo-branch: main

  chapters:
    - index.qmd
    - course.qmd
    - syllabus.qmd
    - curriculum.qmd
    - assignments.qmd
    - part: "Lecture Notes"
      chapters:
        - tutorials/04-genai-simplest-form.qmd
        - tutorials/05-two-point-diffusion.qmd
        - tutorials/01-probability-101.qmd
        - tutorials/16-joints-conditionals.qmd
        - tutorials/02-distributions-mle.qmd
        - tutorials/12-multivariate-gaussian.qmd
        - tutorials/15-comparing-distributions.qmd
    - part: "Decks"
      chapters:
        - decks/01-mechanics.qmd
        - decks/02-motivation.qmd
        - decks/03-two-point.qmd
        - decks/04-probability-joints.qmd
        - decks/05-distributions-mle.qmd
        - decks/06-genai-simplest-form.qmd
    - part: "Tutorials"
      chapters:
        - tutorials/13-inequalities.qmd
    - part: "Perspectives"
      chapters:
        - tutorials/03-transport-story.qmd
        - tutorials/06-map-proved.qmd
        - tutorials/08-transport-rigorous.qmd
        - tutorials/09-discrete-transport.qmd
        - tutorials/10-measuring-things.qmd
        - tutorials/11-joint-conditional-bayes.qmd
        - tutorials/14-why-gaussian.qmd
        - decks/map-proved.qmd
    - part: "Draft"
      chapters:
        - tutorials/07-probability-flow-ode.qmd
    - resources.qmd

format:
  html:
    theme:
      - cosmo
      - iitjammu.scss
    callout-appearance: simple
    number-sections: false
    link-external-newwindow: true

editor: source
