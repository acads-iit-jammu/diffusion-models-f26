      chapters:
        - weeks/w01.qmd
        - weeks/w02.qmd
        - weeks/w03.qmd
        - weeks/w04.qmd
        - weeks/w05.qmd
        - weeks/w06.qmd
        - weeks/w07.qmd
        - weeks/w08.qmd
