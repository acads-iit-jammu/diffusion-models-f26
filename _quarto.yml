  output-dir: _site
  resources:
    - materials/two-point-diffusion-demo.html
    - materials/one-point-noise-demo.html
    - materials/w01-deck-01-mechanics.html
    - materials/w01-deck-02-motivation.html
    - materials/w01-deck-03-toy-example.html
    - materials/w02-deck-00-probability-joints.html
    - materials/w02-deck-01-distributions-mle.html
    - materials/w02-deck-02-genai-maps.html
