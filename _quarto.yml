book:
  title: "ID-5-02 (TO)"
  subtitle: "Mathematical Foundations of Diffusion Models · Monsoon 2026"
  author: "Uma Satyaranjan · Soma S Dhavala · IIT Jammu"
  reader-mode: true
  sidebar:
    collapse-level: 2

  page-footer:
    left: |
      ID-5-02 (TO) · Mathematical Foundations of Diffusion Models · Monsoon 2026 (2026-01) · IIT Jammu
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  site-url: https://acads-iit-jammu.github.io/diffusion-models-f26
  repo-url: https://github.com/acads-iit-jammu/diffusion-models-f26
  repo-branch: main

  chapters:
    - index.qmd
    - course.qmd
    - syllabus.qmd
    - curriculum.qmd
    - assignments.qmd
    - part: "Lecture Notes"
      chapters:
        - tutorials/04-genai-simplest-form.qmd
        - tutorials/05-two-point-diffusion.qmd
        - tutorials/01-probability-101.qmd
        - tutorials/16-joints-conditionals.qmd
        - tutorials/02-distributions-mle.qmd
        - tutorials/12-multivariate-gaussian.qmd
        - tutorials/17-density-estimation-many-dimensions.qmd
        - tutorials/15-comparing-distributions.qmd
        - tutorials/18-metropolis-hastings.qmd
        - tutorials/19-generative-adversarial-networks.qmd
        - tutorials/29-variational-autoencoders.qmd
        - tutorials/30-ddpm.qmd
        - tutorials/43-score-to-sampling.qmd
    - part: tutorials/langevin-diffusion.qmd
      chapters:
        - tutorials/44-langevin-gaussian.qmd
        - tutorials/39-denoising-score-matching.qmd
    - part: tutorials/probability-flow-ode.qmd
      chapters:
        - tutorials/07-probability-flow-ode.qmd
        - tutorials/31-probability-flow-ode-part-2.qmd
        - tutorials/32-probability-flow-ode-part-3.qmd
        - tutorials/33-probability-flow-ode-part-4.qmd
        - tutorials/34-probability-flow-ode-part-5.qmd
        - tutorials/35-probability-flow-ode-part-6.qmd
        - tutorials/41-empirical-score-interpolation.qmd
        - tutorials/36-probability-flow-ode-part-7.qmd
        - tutorials/37-probability-flow-ode-part-8.qmd
        - tutorials/42-ddpm-reverse-vp-sde.qmd
        - tutorials/38-probability-flow-ode-part-9.qmd
    - part: "14 · Reverse-SDE Sampling"
      chapters:
        - tutorials/40-reverse-sde-sampling.qmd
    - part: "Decks"
      chapters:
        - href: materials/w01-deck-01-mechanics.html
          text: "01 · Course Mechanics"
        - href: materials/w01-deck-02-motivation.html
          text: "02 · Why Diffusion Models?"
        - href: materials/w01-deck-03-toy-example.html
          text: "03 · The World's Smallest Diffusion Model"
        - href: materials/w02-deck-00-probability-joints.html
          text: "04 · Probability, Joints, Conditionals and Bayes"
        - href: materials/w02-deck-01-distributions-mle.html
          text: "05 · Distributions and Maximum Likelihood"
        - href: materials/w02-deck-02-genai-maps.html
          text: "06 · Generative AI, in Its Simplest Form"
        - href: materials/w03-deck-01-multivariate-gaussian.html
          text: "07 · The Multivariate Gaussian"
        - href: materials/w04-deck-01-metropolis-hastings.html
          text: "08 · Sampling What You Cannot Normalise"
        - href: materials/w04-deck-02-gans.html
          text: "09 · Generative Adversarial Networks"
    - part: "Tutorials"
      chapters:
        - tutorials/13-inequalities.qmd
        - tutorials/20-random-walk.qmd
    - part: "Paper Readings"
      chapters:
        - papers.qmd
        - tutorials/binomial-diffusion-sohl-dickstein.qmd
    - resources.qmd

format:
  html:
    theme:
      - cosmo
      - iitjammu.scss
    callout-appearance: simple
    number-sections: false
    link-external-newwindow: true

editor: source
