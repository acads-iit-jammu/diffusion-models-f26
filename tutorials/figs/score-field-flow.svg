<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">A local contraction field and its finite-time flow</title>
<desc id="desc">At each position the vector minus x points toward zero, with length proportional to distance. The time-one flow sends each starting x to x divided by e, preserving order and compressing distances.</desc>
<rect width="720" height="390" fill="#fafaf7"/>

<g font-family="system-ui,sans-serif" fill="#222"><text x="30" y="32" font-size="20">Local arrows: v(x) = -x</text>
<text x="30" y="58" font-size="14">Direction gives velocity; longer arrows mean faster motion.</text>
<path d="M70 116 H650" stroke="#b3b3ac"/>
<path d="M105.0 99 H153.0" stroke="#2a78d6" stroke-width="2"/><polygon points="153.0,99 146.0,95 146.0,103" fill="#2a78d6"/><circle cx="105" cy="116" r="3" fill="#333"/><text x="105" y="141" text-anchor="middle" font-size="14">-3</text><path d="M190.0 99 H222.0" stroke="#2a78d6" stroke-width="2"/><polygon points="222.0,99 215.0,95 215.0,103" fill="#2a78d6"/><circle cx="190" cy="116" r="3" fill="#333"/><text x="190" y="141" text-anchor="middle" font-size="14">-2</text><path d="M275.0 99 H291.0" stroke="#2a78d6" stroke-width="2"/><polygon points="291.0,99 284.0,95 284.0,103" fill="#2a78d6"/><circle cx="275" cy="116" r="3" fill="#333"/><text x="275" y="141" text-anchor="middle" font-size="14">-1</text><circle cx="360" cy="116" r="3" fill="#333"/><text x="360" y="141" text-anchor="middle" font-size="14">0</text><path d="M445.0 99 H429.0" stroke="#2a78d6" stroke-width="2"/><polygon points="429.0,99 436.0,95 436.0,103" fill="#2a78d6"/><circle cx="445" cy="116" r="3" fill="#333"/><text x="445" y="141" text-anchor="middle" font-size="14">1</text><path d="M530.0 99 H498.0" stroke="#2a78d6" stroke-width="2"/><polygon points="498.0,99 505.0,95 505.0,103" fill="#2a78d6"/><circle cx="530" cy="116" r="3" fill="#333"/><text x="530" y="141" text-anchor="middle" font-size="14">2</text><path d="M615.0 99 H567.0" stroke="#2a78d6" stroke-width="2"/><polygon points="567.0,99 574.0,95 574.0,103" fill="#2a78d6"/><circle cx="615" cy="116" r="3" fill="#333"/><text x="615" y="141" text-anchor="middle" font-size="14">3</text><text x="30" y="194" font-size="20">Finite motion: time-one map x/e</text>
<text x="30" y="220" font-size="14">Follow the changing arrows for one unit of time.</text>
<path d="M70 260 H650 M70 342 H650" stroke="#b3b3ac"/>
<text x="30" y="263" font-size="13">t = 0</text><text x="30" y="346" font-size="13">t = 1</text><path d="M105 266 L266.1907425012822 336" stroke="#2a78d6" stroke-width="1.5" opacity=".65"/><circle cx="105" cy="260" r="4" fill="#2a78d6"/><circle cx="266.1907425012822" cy="342" r="4" fill="#2a78d6"/><text x="105" y="251" font-size="13" text-anchor="middle">-3</text><path d="M190 266 L297.4604950008548 336" stroke="#2a78d6" stroke-width="1.5" opacity=".65"/><circle cx="190" cy="260" r="4" fill="#2a78d6"/><circle cx="297.4604950008548" cy="342" r="4" fill="#2a78d6"/><text x="190" y="251" font-size="13" text-anchor="middle">-2</text><path d="M275 266 L328.7302475004274 336" stroke="#2a78d6" stroke-width="1.5" opacity=".65"/><circle cx="275" cy="260" r="4" fill="#2a78d6"/><circle cx="328.7302475004274" cy="342" r="4" fill="#2a78d6"/><text x="275" y="251" font-size="13" text-anchor="middle">-1</text><path d="M360 266 L360.0 336" stroke="#2a78d6" stroke-width="1.5" opacity=".65"/><circle cx="360" cy="260" r="4" fill="#2a78d6"/><circle cx="360.0" cy="342" r="4" fill="#2a78d6"/><text x="360" y="251" font-size="13" text-anchor="middle">0</text><path d="M445 266 L391.2697524995726 336" stroke="#2a78d6" stroke-width="1.5" opacity=".65"/><circle cx="445" cy="260" r="4" fill="#2a78d6"/><circle cx="391.2697524995726" cy="342" r="4" fill="#2a78d6"/><text x="445" y="251" font-size="13" text-anchor="middle">1</text><path d="M530 266 L422.5395049991452 336" stroke="#2a78d6" stroke-width="1.5" opacity=".65"/><circle cx="530" cy="260" r="4" fill="#2a78d6"/><circle cx="422.5395049991452" cy="342" r="4" fill="#2a78d6"/><text x="530" y="251" font-size="13" text-anchor="middle">2</text><path d="M615 266 L453.8092574987178 336" stroke="#2a78d6" stroke-width="1.5" opacity=".65"/><circle cx="615" cy="260" r="4" fill="#2a78d6"/><circle cx="453.8092574987178" cy="342" r="4" fill="#2a78d6"/><text x="615" y="251" font-size="13" text-anchor="middle">3</text><text x="266.1907425012822" y="369" font-size="13" text-anchor="middle">-1.10</text><text x="360.0" y="369" font-size="13" text-anchor="middle">0.00</text><text x="453.8092574987178" y="369" font-size="13" text-anchor="middle">1.10</text></g></svg>